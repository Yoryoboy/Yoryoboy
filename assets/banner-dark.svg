<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Jorge Diaz</title>
  <desc id="d">Software Engineer, AI-native. Building agents, MCP servers and developer tooling.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.5" fill="#21262d"/></pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0.45" stop-color="#0d1117" stop-opacity="1"/><stop offset="0.75" stop-color="#0d1117" stop-opacity="0"/></linearGradient>
    <clipPath id="card"><rect x="0.5" y="0.5" width="1199" height="299" rx="14"/></clipPath>
  </defs>
  <style>
    .edge{stroke:url(#accent);stroke-width:1.5;stroke-dasharray:4 6;animation:flow 6s linear infinite}
    .pulse{animation:pulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes flow{to{stroke-dashoffset:-60}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion: reduce){.edge,.pulse,.cursor{animation:none}}
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#0d1117"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect width="1200" height="300" fill="url(#fade)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
    <g opacity="0.9">
      <line class="edge" x1="880" y1="90" x2="980" y2="150"/>
      <line class="edge" x1="980" y1="150" x2="1080" y2="80"/>
      <line class="edge" x1="980" y1="150" x2="940" y2="230"/>
      <line class="edge" x1="980" y1="150" x2="1060" y2="220"/>
      <line class="edge" x1="1080" y1="80" x2="1130" y2="150"/>
      <line class="edge" x1="1060" y1="220" x2="1130" y2="150"/>
      <line class="edge" x1="940" y1="230" x2="1060" y2="220"/>
      <circle cx="880" cy="90" r="6" fill="#0d1117" stroke="url(#accent)" stroke-width="2"/>
      <circle cx="980" cy="150" r="9" fill="#0d1117" stroke="url(#accent)" stroke-width="2"/><circle class="pulse" cx="980" cy="150" r="3.5" fill="url(#accent)"/>
      <circle cx="1080" cy="80" r="6" fill="#0d1117" stroke="url(#accent)" stroke-width="2"/>
      <circle cx="940" cy="230" r="6" fill="#0d1117" stroke="url(#accent)" stroke-width="2"/>
      <circle cx="1060" cy="220" r="6" fill="#0d1117" stroke="url(#accent)" stroke-width="2"/>
      <circle cx="1130" cy="150" r="6" fill="#0d1117" stroke="url(#accent)" stroke-width="2"/>
    </g>
    <rect x="64" y="84" width="40" height="4" rx="2" fill="url(#accent)"/>
    <text x="62" y="152" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="58" font-weight="650" letter-spacing="-1.5" fill="#f0f6fc">Jorge Diaz</text>
    <text x="64" y="194" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="24" font-weight="450" fill="#9198a1">Software Engineer, <tspan fill="url(#accent)" font-weight="600">AI-native</tspan></text>
    <text x="64" y="236" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" fill="#7d8590"><tspan fill="#22d3ee">›</tspan> agents · mcp servers · dev tooling · buenos aires<tspan class="cursor" fill="#22d3ee"> ▍</tspan></text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="14" fill="none" stroke="#30363d"/>
</svg>
